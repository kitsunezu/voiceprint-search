name: Publish Images

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.event.workflow_run.head_branch || github.ref_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/voiceprint-search-frontend
  AI_SERVICE_IMAGE: ghcr.io/${{ github.repository_owner }}/voiceprint-search-ai-service

jobs:
  publish-frontend:
    name: Publish Frontend Image
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract frontend metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.event.workflow_run.head_branch == 'main' || github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == 'main' || github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  publish-ai-service:
    name: Publish AI Service Image
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract AI service metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AI_SERVICE_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.event.workflow_run.head_branch == 'main' || github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == 'main' || github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build and push AI service image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

  deploy-coolify:
    name: Deploy to Coolify
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    needs:
      - publish-frontend
      - publish-ai-service
    steps:
      - name: Connect to Kitsunet over Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:kitsunet-deploy
          ping: 192.168.1.5
          args: --accept-routes
          version: 1.94.2

      - name: Request Coolify deployment
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          COOLIFY_URL: http://192.168.1.5:8000
          COOLIFY_SERVICE_UUID: "5cizyllxw1ozz4twubd6dgxk"
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_SERVICE_UUID&force=false")"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Coolify deploy request failed (HTTP $status)"
            exit 1
          fi
          if ! jq --exit-status --arg uuid "$COOLIFY_SERVICE_UUID" '
            .deployments | length == 1 and
            .[0].resource_uuid == $uuid and
            (.[0].message | startswith("Service ") and
              endswith(" started. It could take a while, be patient."))
          ' "$response_file" >/dev/null 2>&1; then
            echo "::error::Coolify did not confirm a start request for the expected service"
            exit 1
          fi
          echo "Coolify accepted deployment request for commit ${{ github.event.workflow_run.head_sha || github.sha }}"
